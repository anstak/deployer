name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          APP_NAME: ${{ github.event.repository.name }}
          DOMAIN: ${{ vars.DOMAIN }}
          APP_PORT: ${{ vars.APP_PORT || '3000' }}
          NODE_ENV: ${{ vars.NODE_ENV || 'production' }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_NAME,DOMAIN,APP_PORT,NODE_ENV,ENV_FILE
          command_timeout: 30m
          script: |
            set -e

            echo "==> Starting deployment of $APP_NAME"
            cd ~/$APP_NAME

            echo "==> Updating source code"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Creating .env file"
            cat <<EOF > .env
            NODE_ENV=$NODE_ENV
            PORT=$APP_PORT
            $ENV_FILE
            EOF

            echo "==> Configuring Caddy"
            cat <<EOF > /etc/caddy/sites/$APP_NAME
            $DOMAIN {
                reverse_proxy localhost:$APP_PORT
            }
            EOF

            caddy validate --config /etc/caddy/Caddyfile 2>&1 || { echo "ERROR: Invalid Caddy config"; exit 1; }
            BLOCKED=$(ss -tlnp | grep ":443" | grep -v caddy || true)
            if [ -n "$BLOCKED" ]; then echo "ERROR: Port 443 is occupied: $BLOCKED"; exit 1; fi
            systemctl reload caddy

            echo "==> Installing dependencies"
            corepack enable 2>/dev/null || true
            pnpm install --frozen-lockfile

            echo "==> Building app"
            pnpm build

            echo "==> Running database migrations"
            pnpm db:migrate

            echo "==> Restarting PM2 process"
            pm2 delete $APP_NAME || true
            
            pm2 start build/index.js --name $APP_NAME --node-args="--env-file=.env"
            
            pm2 save

            echo "==> SUCCESS: $APP_NAME is deployed on https://$DOMAIN"