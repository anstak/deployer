name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            APP_NAME=${{ github.event.repository.name }}
            cd ~/$APP_NAME
            git pull origin main

            cat > .env << ENVEOF
            NODE_ENV=${{ vars.NODE_ENV || 'production' }}
            PORT=${{ vars.APP_PORT || '3000' }}
            ${{ secrets.ENV_FILE }}
            ENVEOF

            cat > /etc/caddy/sites/$APP_NAME << CADDYEOF
            ${{ vars.DOMAIN }} {
                reverse_proxy localhost:${{ vars.APP_PORT || '3000' }}
            }
            CADDYEOF
            systemctl reload caddy

            pnpm install --frozen-lockfile
            pnpm build
            pnpm db:push
            pm2 restart $APP_NAME || pm2 start dist/index.js --name $APP_NAME
            pm2 save