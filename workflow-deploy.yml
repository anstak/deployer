name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          APP_NAME: ${{ github.event.repository.name }}
          DOMAIN: ${{ vars.DOMAIN }}
          APP_PORT: ${{ vars.APP_PORT || '3000' }}
          NODE_ENV: ${{ vars.NODE_ENV || 'production' }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_NAME,DOMAIN,APP_PORT,NODE_ENV,ENV_FILE
          command_timeout: 30m
          script: |
            set -e
            echo "==> Deploying $APP_NAME"
            cd ~/$APP_NAME
            echo "==> Pulling latest code"
            git fetch origin main
            git reset --hard origin/main
            echo "==> Writing .env"
            echo "NODE_ENV=$NODE_ENV" > .env
            echo "PORT=$APP_PORT" >> .env
            echo "$ENV_FILE" >> .env
            echo "==> Configuring Caddy"
            echo "$DOMAIN {" > /etc/caddy/sites/$APP_NAME
            echo "    reverse_proxy localhost:$APP_PORT" >> /etc/caddy/sites/$APP_NAME
            echo "}" >> /etc/caddy/sites/$APP_NAME
            caddy validate --config /etc/caddy/Caddyfile 2>&1 || { echo "ERROR: Invalid Caddy config"; exit 1; }
            BLOCKED=$(ss -tlnp | grep ":443" | grep -v caddy || true)
            if [ -n "$BLOCKED" ]; then echo "ERROR: Port 443 is occupied: $BLOCKED"; exit 1; fi
            systemctl reload caddy
            echo "==> Installing dependencies"
            corepack enable 2>/dev/null || true
            pnpm install --frozen-lockfile
            echo "==> Building"
            pnpm build
            echo "==> Running migrations"
            pnpm db:migrate
            echo "==> Restarting app"
            pm2 delete $APP_NAME || true
            pm2 start build/index.js --name $APP_NAME --node-args="--env-file=.env"
            pm2 save
            echo "==> Deploy complete!"